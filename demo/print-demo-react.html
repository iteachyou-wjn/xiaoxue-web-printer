<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React 打印示例 - 晓雪WEB打印控件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background:#f0f2f5; color:#1f2329; padding:24px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .topbar h1 { font-size:20px; }
    .topbar a { color:#3370ff; text-decoration:none; font-size:13px; }
    .conn { display:flex; align-items:center; gap:8px; font-size:13px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .dot.on { background:#34c724; } .dot.off { background:#c0c4cc; }
    .layout { display:grid; grid-template-columns:1.2fr 1fr; gap:20px; } /* 不再使用 */
    .settings-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px; }
    .settings-grid .form-item { min-width:0; }
    .settings-panel { margin-bottom:24px; }
    .panel { background:#fff; border-radius:10px; padding:20px; border:1px solid #e5e6eb; }
    .panel h2 { font-size:15px; margin-bottom:16px; border-bottom:1px solid #f0f1f3; padding-bottom:10px; }
    .tabs { display:flex; gap:4px; border-bottom:2px solid #e5e6eb; margin-bottom:16px; }
    .tab { padding:9px 18px; cursor:pointer; font-size:14px; color:#5a6068; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
    .tab:hover { color:#61dafb; }
    .tab.active { color:#0ea5e9; border-bottom-color:#0ea5e9; font-weight:600; }
    .form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .form-item { flex:1; min-width:140px; }
    .form-item label { display:block; font-size:12px; color:#8a919f; margin-bottom:5px; }
    .form-item input,.form-item select,.form-item textarea { width:100%; padding:7px 10px; border:1px solid #d9dce0; border-radius:6px; font-size:13px; outline:none; }
    .form-item input:focus,.form-item select:focus,.form-item textarea:focus { border-color:#61dafb; }
    .form-item textarea { resize:vertical; min-height:180px; font-family:Consolas,monospace; }
    .form-item.full { flex:0 0 100%; }
    .actions { display:flex; gap:12px; margin-top:4px; }
    .btn { padding:9px 22px; border:none; border-radius:6px; font-size:14px; cursor:pointer; color:#fff; }
    .btn-primary { background:#61dafb; color:#000; } .btn-primary:hover { background:#4ac3e4; }
    .btn-primary:disabled { background:#c0c4cc; cursor:not-allowed; color:#fff; }
    .btn-success { background:#3370ff; } .btn-success:hover { background:#2b5fd6; }
    .btn-success:disabled { background:#c0c4cc; cursor:not-allowed; }
    .log { margin-top:20px; background:#1e1e1e; color:#d4d4d4; border-radius:8px; padding:12px; font-size:12px; font-family:Consolas,monospace; height:180px; overflow-y:auto; }
    .log div { line-height:1.7; }
    .log .info{color:#d4d4d4;} .log .success{color:#4ec950;} .log .error{color:#f0616d;} .log .warn{color:#d9a520;}
    .hint { font-size:12px; color:#8a919f; margin-top:8px; }
    .badge { display:inline-block; background:#e8f7fd; color:#0ea5e9; font-size:12px; padding:2px 10px; border-radius:10px; margin-left:8px; }
    .code-block h3 { font-size:14px; margin:14px 0 8px; color:#0ea5e9; }
    .code-block p { font-size:13px; color:#5a6068; line-height:1.8; margin-bottom:8px; }
    .code-block ol { margin:6px 0 8px 20px; font-size:13px; color:#5a6068; line-height:1.9; }
    .code-block pre { background:#1e1e1e; color:#d4d4d4; border-radius:8px; padding:14px; font-size:12px; font-family:Consolas,monospace; line-height:1.6; overflow-x:auto; margin:8px 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>⚛️ React 打印示例 <span class="badge">React 18 + Hooks</span></h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <a href="index.html">← 返回首页</a>
      <div class="conn"><span class="dot off" id="connDot"></span><span id="connText">未连接</span></div>
    </div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../xiaoxue-printer-sdk.min.js"></script>
  <script type="text/babel">
    var fmt = function () { return '[' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '] '; };
    var LOG_REF = { current: null };

    function App() {
      const { useState, useEffect, useRef } = React;
      const [activeTab, setActiveTab] = useState('text');
      const [connected, setConnected] = useState(false);
      const [printers, setPrinters] = useState([]);
      const [paperSizes, setPaperSizes] = useState([]);
      const [printer, setPrinter] = useState('');
      const [paper, setPaper] = useState('');
      const [content, setContent] = useState('尊敬的客户：\n\n感谢您使用晓雪WEB打印控件（React 集成示例）。\n\n通过 new XiaoxuePrinterSDK({ url }) 创建实例，即可调用打印服务。\n\n—— I Teach You, 我教你！');
      const [htmlContent, setHtmlContent] = useState('<h1 style="text-align:center;color:#0ea5e9">React HTML 打印</h1>\n<p style="text-align:center;color:#888">HTML 片段完整渲染</p>\n<hr>\n<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;text-align:center">\n  <tr style="background:#0ea5e9;color:#fff"><th>项目</th><th>数量</th><th>金额</th></tr>\n  <tr><td>打印机服务</td><td>1</td><td>1,200.00</td></tr>\n  <tr><td>技术服务</td><td>2</td><td>3,600.00</td></tr>\n</table>');
      const [direction, setDirection] = useState('vertical');
      const [zoom, setZoom] = useState(1);
      const [fontFamily, setFontFamily] = useState('宋体');
      const [fontSize, setFontSize] = useState(12);
      const [margins, setMargins] = useState({ top: 1, right: 1, bottom: 1, left: 1 });
      const [paperHeader, setPaperHeader] = useState('');
      const [paperFooter, setPaperFooter] = useState('');
      const [logs, setLogs] = useState([]);
  const [btTemplate, setBtTemplate] = useState('');
  const [btParamsText, setBtParamsText] = useState('');
  const [btInstance, setBtInstance] = useState(null);
  const [btInstanceInfo, setBtInstanceInfo] = useState('（点击「获取 BarTender 实例」查看版本信息）');
  const [btParamsResult, setBtParamsResult] = useState('（模板参数将显示在这里）');
  const [btPreviewImg, setBtPreviewImg] = useState('');
      const sdkRef = useRef(null);

      const log = function (msg, level) {
        setLogs(prev => prev.concat([{ text: fmt() + msg, level: level || 'info' }]));
        setTimeout(() => { if (LOG_REF.current) LOG_REF.current.scrollTop = LOG_REF.current.scrollHeight; }, 50);
      };

      const refreshPrinters = function (sdk) {
        sdk.getPrinters().then(function (r) {
          const list = r.printers || [];
          setPrinters(list);
          log('获取打印机成功: ' + list.join(', '), 'success');
          if (list.length) { setPrinter(list[0]); loadPageSizes(sdk, list[0]); }
        }).catch(function (e) { log('获取打印机失败: ' + e.message, 'error'); });
      };

      const loadPageSizes = function (sdk, p) {
        if (!p) return;
        sdk.getPageSize(p).then(function (r) {
          const list = r.sizes || [];
          setPaperSizes(list);
          log('获取「' + p + '」纸张: ' + list.join(', '), 'success');
          if (list.length) setPaper(list[0]);
        }).catch(function (e) { log('获取纸张失败: ' + e.message, 'error'); });
      };

      useEffect(function () {
        const sdk = new XiaoxuePrinterSDK({ url: 'ws://localhost:54321' });
        sdkRef.current = sdk;
        sdk.on('open', function () { setConnected(true); log('已连接到打印服务', 'info'); refreshPrinters(sdk); });
        sdk.on('close', function () { setConnected(false); log('连接已断开', 'warn'); });
        sdk.on('error', function (e) { log('连接错误: ' + (e && e.message || '未知'), 'error'); });
        sdk.connect();
        return function () { sdk.disconnect(); };
      }, []);

      useEffect(function () {
        const dot = document.getElementById('connDot');
        const txt = document.getElementById('connText');
        if (dot) dot.className = 'dot ' + (connected ? 'on' : 'off');
        if (txt) txt.textContent = connected ? '已连接' : '未连接';
      }, [connected]);

      const buildRequest = function () {
        const isHtml = activeTab === 'html';
        const isBt = activeTab === 'bartender';
        const base = {
          printer: printer,
          style: {
            paper: paper, direction: direction,
            margin: { top: margins.top || 0, right: margins.right || 0, bottom: margins.bottom || 0, left: margins.left || 0 },
            zoom: zoom || 1, fontFamily: fontFamily, fontSize: fontSize || 12,
            paperHeader: paperHeader, paperFooter: paperFooter
          }
        };
        if (isBt) {
          let params = {};
          try { params = JSON.parse(btParamsText || '{}'); } catch (e) { params = {}; }
          base.content = { type: 'bartender', value: btTemplate, params: params };
          return base;
        }
        base.content = isHtml ? { type: 'html', value: htmlContent } : { type: 'text', value: content };
        return base;
      };

      const onPreview = function () {
        sdkRef.current.doPreview(buildRequest())
          .then(r => log('预览指令已发送: ' + (r.message || 'ok'), 'success'))
          .catch(e => log('预览失败: ' + e.message, 'error'));
      };
      const onPrint = function () {
        sdkRef.current.doPrint(buildRequest())
          .then(r => log('打印任务已提交，任务ID: ' + r.taskId, 'success'))
          .catch(e => log('打印失败: ' + e.message, 'error'));
      };
      const onBtInstance = function () {
        sdkRef.current.getBartenderInstance().then(bt => {
          setBtInstance(bt);
          setBtInstanceInfo('BarTender 可用: ' + bt.available + '，版本: ' + (bt.version || '未知')
            + (bt.fullVersion ? '，完整信息: ' + bt.fullVersion : ''));
          log('获取 BarTender 实例成功: 版本=' + (bt.version || '未知'), 'success');
        }).catch(e => log('获取 BarTender 实例失败: ' + e.message, 'error'));
      };
      const onBtParams = function () {
        if (!btTemplate) { log('请先填写模板路径', 'warn'); return; }
        if (!btInstance) { log('请先点击「获取 BarTender 实例」', 'warn'); return; }
        btInstance.getTemplateParams(btTemplate).then(r => {
          const list = r.params || [];
          const parts = list.map(it => it.name + ' (' + it.type + ')');
          setBtParamsResult('模板参数: ' + (parts.length ? parts.join(', ') : '（无）'));
          log('获取模板参数成功: ' + (parts.length ? parts.join(', ') : '（无）'), 'success');
        }).catch(e => log('获取模板参数失败: ' + e.message, 'error'));
      };
      const onBtImage = function () {
        if (!btTemplate) { log('请先填写模板路径', 'warn'); return; }
        if (!btInstance) { log('请先点击「获取 BarTender 实例」', 'warn'); return; }
        btInstance.getTemplateImage(btTemplate).then(r => {
          setBtPreviewImg(r.image ? 'data:image/png;base64,' + r.image : '');
          log('获取模板图像成功', 'success');
        }).catch(e => log('获取模板图像失败: ' + e.message, 'error'));
      };
      const onBtImageWithParams = function () {
        if (!btTemplate) { log('请先填写模板路径', 'warn'); return; }
        if (!btInstance) { log('请先点击「获取 BarTender 实例」', 'warn'); return; }
        let params = {};
        try { params = JSON.parse(btParamsText || '{}'); } catch (e) { params = {}; }
        btInstance.getTemplateImageWithParams(btTemplate, params).then(r => {
          setBtPreviewImg(r.image ? 'data:image/png;base64,' + r.image : '');
          log('获取带参数模板图像成功', 'success');
        }).catch(e => log('获取带参数模板图像失败: ' + e.message, 'error'));
      };
      const setMargin = function (k, v) { const m = Object.assign({}, margins); m[k] = +v || 0; setMargins(m); };

      const tabCls = function (t) { return 'tab' + (activeTab === t ? ' active' : ''); };

      return (
        <div>
          {/* 打印设置：tabs 上方，一行6列 */}
          <div className="panel settings-panel">
            <h2>打印设置</h2>
            <div className="settings-grid">
              <div className="form-item">
                <label>打印机</label>
                <select value={printer} onChange={e => { const v = e.target.value; setPrinter(v); loadPageSizes(sdkRef.current, v); }}>
                  <option value="">请选择打印机</option>
                  {printers.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div className="form-item">
                <label>纸张</label>
                <select value={paper} onChange={e => setPaper(e.target.value)}>
                  <option value="">请先选择打印机</option>
                  {paperSizes.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="form-item">
                <label>方向</label>
                <select value={direction} onChange={e => setDirection(e.target.value)}>
                  <option value="vertical">纵向</option>
                  <option value="horizontal">横向</option>
                </select>
              </div>
              <div className="form-item">
                <label>缩放比例</label>
                <input type="number" step="0.1" min="0.1" value={zoom} onChange={e => setZoom(+e.target.value)} />
              </div>
              <div className="form-item">
                <label>字体</label>
                <select value={fontFamily} onChange={e => setFontFamily(e.target.value)}>
                  {['宋体', '微软雅黑', '黑体', '楷体', '仿宋', 'Arial'].map(f => <option key={f} value={f}>{f}</option>)}
                </select>
              </div>
              <div className="form-item">
                <label>字号</label>
                <input type="number" min="6" max="72" value={fontSize} onChange={e => setFontSize(+e.target.value)} />
              </div>
              {['top', 'right', 'bottom', 'left'].map(k => (
                <div className="form-item" key={k}>
                  <label>边距-{k} (cm)</label>
                  <input type="number" step="0.1" value={margins[k]} onChange={e => setMargin(k, e.target.value)} />
                </div>
              ))}
              <div className="form-item">
                <label>页头</label>
                <input value={paperHeader} onChange={e => setPaperHeader(e.target.value)} placeholder="如：销售报表" />
              </div>
              <div className="form-item">
                <label>页脚</label>
                <input value={paperFooter} onChange={e => setPaperFooter(e.target.value)} placeholder="如：第 {page} 页" />
              </div>
            </div>
            <div className="actions">
              <button className="btn btn-primary" disabled={!connected} onClick={onPreview}>打印预览</button>
              <button className="btn btn-success" disabled={!connected} onClick={onPrint}>执行打印</button>
            </div>
          </div>

          {/* tabs + 内容 */}
          <div className="panel">
            <div className="tabs">
              <div className={tabCls('text')} onClick={() => setActiveTab('text')}>文本</div>
              <div className={tabCls('html')} onClick={() => setActiveTab('html')}>HTML</div>
              <div className={tabCls('task')} onClick={() => setActiveTab('task')}>打印任务</div>
              <div className={tabCls('bartender')} onClick={() => setActiveTab('bartender')}>BarTender</div>
              <div className={tabCls('code')} onClick={() => setActiveTab('code')}>集成代码</div>
            </div>

            {activeTab === 'text' && (
              <div>
                <div className="form-item full">
                  <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="请输入要打印的文本内容..." />
                </div>
                <div className="hint">将以纯文本方式渲染，支持换行与空白字符。</div>
              </div>
            )}

            {activeTab === 'html' && (
              <div>
                <div className="form-item full">
                  <textarea style={{ minHeight: 300 }} value={htmlContent} onChange={e => setHtmlContent(e.target.value)} placeholder="请输入 HTML 片段，将保留样式渲染..." />
                </div>
                <div className="hint">HTML 片段完整渲染，支持内联样式 / base64 或 http(s) 图片。</div>
              </div>
            )}

            {activeTab === 'code' && (
              <div className="code-block">
                <h3>一、引入 SDK</h3>
                <p>将 <code>xiaoxue-printer-sdk.min.js</code> 复制到项目 public 目录，并在 <code>index.html</code> 中引入：</p>
                <pre>{'<script src="path/to/xiaoxue-printer-sdk.min.js"><\/script>'}</pre>

                <h3>二、在 React 组件中使用（Hooks）</h3>
                <pre>{`import { useEffect, useRef, useState } from 'react';

export default function App() {
  const sdkRef = useRef(null);
  const [connected, setConnected] = useState(false);
  const [printers, setPrinters] = useState([]);

  useEffect(() => {
    const sdk = new XiaoxuePrinterSDK({ url: 'ws://localhost:54321' });
    sdkRef.current = sdk;
    sdk.on('open', () => { setConnected(true); fetchPrinters(sdk); });
    sdk.connect();
    return () => sdk.disconnect();
  }, []);

  async function fetchPrinters(sdk) {
    const r = await sdk.getPrinters();
    setPrinters(r.printers || []);
  }

  function doPrint() {
    sdkRef.current.doPrint({
      printer: '默认打印机',
      style: { paper: 'A4', direction: 'vertical', fontSize: 12 },
      content: { type: 'text', value: '打印内容' }
    }).then(r => console.log('任务ID:', r.taskId));
  }
}`}</pre>

                <h3>三、API 一览</h3>
                <ol>
                  <li><code>getPrinters()</code> - 获取可用打印机</li>
                  <li><code>getPageSize(printerName)</code> - 获取指定打印机纸张</li>
                  <li><code>doPrint(json)</code> - 提交并执行打印任务</li>
                  <li><code>doPreview(json)</code> - 打开打印预览窗口</li>
                  <li><code>getTaskList / getTaskStatus / cancelTask / clearTasks</code> - 任务管理</li>
                  <li><code>getBartenderInstance()</code> - 获取 BarTender 实例（含版本号）</li>
                </ol>

                <h3>四、BarTender 集成</h3>
                <pre>{`// 获取 BarTender 实例（含版本号）
const bt = await sdk.getBartenderInstance()
console.log(bt.available, bt.version, bt.fullVersion)

// 获取模板参数（含控件类型：Barcode/Text/Picture 等）
const p = await bt.getTemplateParams('D:\\\\labels\\\\a.btw')
// p.params => [{ name: 'barcode1', type: 'Barcode' }]

// 获取模板图像（返回 base64）
const img = await bt.getTemplateImage('D:\\\\labels\\\\a.btw')

// 获取带参数模板图像
const img2 = await bt.getTemplateImageWithParams('D:\\\\labels\\\\a.btw', { 字段1: '值1' })`}</pre>
              </div>
            )}

            {activeTab === 'task' && (
              <div className="code-block">
                <h3>一、任务管理 API</h3>
                <p>以下接口均需通过 <code>XiaoxuePrinterSDK</code> 实例调用：</p>
                <ol>
                  <li><code>getTaskList()</code> - 获取任务列表，返回 <code>{'{ tasks: [...] }'}</code></li>
                  <li><code>getTaskStatus(taskId)</code> - 查询单个任务状态，返回 <code>{'{ task?, found }'}</code></li>
                  <li><code>cancelTask(taskId)</code> - 取消「待打印 / 打印中」任务，返回 <code>{'{ success, message }'}</code></li>
                  <li><code>clearTasks()</code> - 清除「已完成 / 失败」任务，返回 <code>{'{ success, message }'}</code></li>
                  <li><code>doPrint(json)</code> - 提交并执行打印任务，返回 <code>{'{ success, taskId }'}</code></li>
                  <li><code>taskListUpdate</code> 事件 - 服务端在任务变化时主动推送任务列表</li>
                </ol>

                <h3>二、在 React 中使用（Hooks）</h3>
                <pre>{`import { useEffect, useRef, useState } from 'react';

export default function TaskList() {
  const sdkRef = useRef(null);
  const [tasks, setTasks] = useState([]);

  useEffect(() => {
    const sdk = new XiaoxuePrinterSDK({ url: 'ws://localhost:54321' });
    sdkRef.current = sdk;
    sdk.on('taskListUpdate', (list) => setTasks(list || []));
    sdk.on('open', refresh);
    sdk.connect();
    return () => sdk.disconnect();
  }, []);

  async function refresh() {
    const r = await sdkRef.current.getTaskList();
    setTasks(r.tasks || []);
  }
  // 提交打印任务
  function submit() {
    sdkRef.current.doPrint({
      printer: '默认打印机', style: { paper: 'A4' },
      content: { type: 'text', value: '打印内容' }
    }).then(r => console.log('任务ID:', r.taskId));
  }
  // 查询状态 / 取消 / 清除
  function query(id) { sdkRef.current.getTaskStatus(id).then(r => console.log(r.task)); }
  function cancel(id) { sdkRef.current.cancelTask(id).then(r => console.log(r.message)); }
  function clearDone() { sdkRef.current.clearTasks().then(r => console.log(r.message)); }
}`}</pre>

                <h3>三、任务状态说明</h3>
                <ol>
                  <li><code>PENDING</code> - 待打印（可取消）</li>
                  <li><code>PRINTING</code> - 打印中（可取消）</li>
                  <li><code>COMPLETED</code> - 已完成</li>
                  <li><code>FAILED</code> - 失败（可通过 <code>errorMessage</code> 查看原因）</li>
                </ol>
              </div>
            )}

            {activeTab === 'bartender' && (
              <div>
                <div className="form-item full">
                  <label>BarTender 模板路径 (.btw)</label>
                  <input value={btTemplate} onChange={e => setBtTemplate(e.target.value)} placeholder="如：D:\labels\mylabel.btw" />
                </div>
                <div className="form-item full" style={{ marginTop: 12 }}>
                  <label>模板字段 (JSON，可选)</label>
                  <textarea style={{ minHeight: 120 }} value={btParamsText} onChange={e => setBtParamsText(e.target.value)} placeholder='如：{"字段1":"值1"}' />
                </div>
                <div className="actions" style={{ marginTop: 16, flexWrap: 'wrap' }}>
                  <button className="btn btn-primary" disabled={!connected} onClick={onBtInstance}>获取 BarTender 实例</button>
                  <button className="btn btn-success" disabled={!connected} onClick={onBtParams}>获取模板参数</button>
                  <button className="btn btn-success" disabled={!connected} onClick={onBtImage}>获取模板图像</button>
                  <button className="btn btn-success" disabled={!connected} onClick={onBtImageWithParams}>获取带参数模板图像</button>
                </div>
                <div className="hint" style={{ marginTop: 12 }}>{btInstanceInfo}</div>
                <div className="hint" style={{ marginTop: 8 }}>{btParamsResult}</div>
                {btPreviewImg && <div style={{ marginTop: 10 }}><img src={btPreviewImg} style={{ maxWidth: '100%', border: '1px solid #e5e6eb', borderRadius: 6, background: '#fff' }} /></div>}
                <div className="hint" style={{ marginTop: 12 }}>预览/打印时将直接调用本机 BarTender 渲染或打印该模板。</div>
              </div>
            )}
          </div>

          <div className="log" ref={el => { LOG_REF.current = el; }}>
            {logs.map((l, i) => <div key={i} className={l.level}>{l.text}</div>)}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
