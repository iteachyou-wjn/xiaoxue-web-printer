<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打印控件 WebSocket 测试客户端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f6fa; padding: 20px; color: #2c3e50;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .card {
            background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h2 {
            font-size: 16px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .form-row label { width: 100px; font-size: 14px; color: #555; }
        .form-row input, .form-row textarea {
            flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
        }
        .form-row textarea { min-height: 60px; resize: vertical; }
        .btn {
            padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        .connection-status {
            display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;
        }
        .status-connected { background: #d4edda; color: #155724; }
        .status-disconnected { background: #f8d7da; color: #721c24; }
        .status-connecting { background: #fff3cd; color: #856404; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold;
        }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-printing { background: #d1ecf1; color: #0c5460; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-failed { background: #f8d7da; color: #721c24; }
        #log {
            background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px;
            font-family: "Consolas", "Monaco", monospace; font-size: 12px; max-height: 300px;
            overflow-y: auto; line-height: 1.6;
        }
        .log-msg { color: #d4d4d4; }
        .log-send { color: #4ec9b0; }
        .log-recv { color: #9cdcfe; }
        .log-error { color: #f48771; }
        .log-info { color: #dcdcaa; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖨️ 打印控件 WebSocket 测试客户端</h1>

        <div class="card">
            <h2>连接配置</h2>
            <div class="form-row">
                <label>服务器地址</label>
                <input type="text" id="wsUrl" value="ws://127.0.0.1:54321">
                <button class="btn btn-success" onclick="connect()">连接</button>
                <button class="btn btn-danger" onclick="disconnect()">断开</button>
            </div>
            <div style="margin-top: 8px;">
                状态：<span id="connStatus" class="connection-status status-disconnected">未连接</span>
            </div>
        </div>

        <div class="card">
            <h2>提交打印（doPrint）</h2>
            <div class="form-row">
                <label>打印机</label>
                <input type="text" id="printerName" value="默认打印机">
            </div>
            <div class="form-row">
                <label>纸张</label>
                <input type="text" id="paper" value="A4">
            </div>
            <div class="form-row">
                <label>打印内容</label>
                <textarea id="taskContent">这是一段测试打印内容。
Hello, Print Control!</textarea>
            </div>
            <div class="form-row">
                <label></label>
                <button class="btn btn-primary" onclick="doPrint()">执行打印</button>
            </div>
        </div>

        <div class="card">
            <h2>任务列表</h2>
            <div class="action-btns" style="margin-bottom: 15px;">
                <button class="btn btn-secondary" onclick="queryTasks()">刷新列表</button>
                <button class="btn btn-warning" onclick="clearTasks()">清除已完成/失败</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>任务ID</th>
                        <th>任务名称</th>
                        <th>打印机</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr><td colspan="6" style="text-align:center;color:#999;">暂无数据</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>通信日志</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;

        function log(msg, type = 'msg') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-' + type;
            div.textContent = `[${time}] ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, cls) {
            const el = document.getElementById('connStatus');
            el.textContent = text;
            el.className = 'connection-status ' + cls;
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            if (ws && ws.readyState === WebSocket.OPEN) { log('已经连接', 'info'); return; }
            setStatus('连接中...', 'status-connecting');
            log('正在连接: ' + url, 'info');
            try {
                ws = new WebSocket(url);
                ws.onopen = () => { setStatus('已连接', 'status-connected'); log('WebSocket 连接已建立', 'info'); };
                ws.onmessage = (event) => { log('← ' + event.data, 'recv'); handleMessage(JSON.parse(event.data)); };
                ws.onclose = () => { setStatus('未连接', 'status-disconnected'); log('WebSocket 连接已关闭', 'info'); };
                ws.onerror = () => { log('WebSocket 错误', 'error'); };
            } catch (e) {
                log('连接失败: ' + e.message, 'error');
                setStatus('未连接', 'status-disconnected');
            }
        }

        function disconnect() { if (ws) { ws.close(); ws = null; } }

        function send(obj) {
            if (!ws || ws.readyState !== WebSocket.OPEN) { log('未连接，无法发送', 'error'); return; }
            const msg = JSON.stringify(obj);
            log('→ ' + msg, 'send');
            ws.send(msg);
        }

        function doPrint() {
            send({
                type: 'doPrint',
                printer: document.getElementById('printerName').value,
                style: { paper: document.getElementById('paper').value || 'A4' },
                content: { type: 'text', value: document.getElementById('taskContent').value }
            });
        }

        function queryTasks() { send({ type: 'list' }); }
        function clearTasks() { send({ type: 'clear' }); }
        function cancelTask(taskId) { send({ type: 'cancel', taskId: taskId }); }

        function handleMessage(data) {
            switch (data.type) {
                case 'welcome': log('服务器: ' + data.message, 'info'); break;
                case 'task_list':
                case 'task_list_update': renderTasks(data.tasks || []); break;
                case 'doPrint_result':
                    if (data.success) { log('打印任务已提交，ID: ' + data.taskId, 'info'); queryTasks(); }
                    break;
                case 'cancel_result': log(data.message, data.success ? 'info' : 'error'); queryTasks(); break;
                case 'clear_result': log(data.message, 'info'); queryTasks(); break;
                case 'error': log('服务器错误: ' + data.message, 'error'); break;
            }
        }

        function renderTasks(tasks) {
            const tbody = document.getElementById('taskTableBody');
            if (!tasks || tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = tasks.map(t => {
                const statusClass = 'badge-' + t.status.toLowerCase();
                const canCancel = t.status === 'PENDING';
                return `<tr>
                    <td>${t.id}</td>
                    <td>${t.name || '-'}</td>
                    <td>${t.printerName || '-'}</td>
                    <td><span class="badge ${statusClass}">${statusText(t.status)}</span></td>
                    <td>${t.createTime || '-'}</td>
                    <td>${canCancel ? `<button class="btn btn-danger" style="padding:2px 8px;font-size:11px;" onclick="cancelTask('${t.id}')">取消</button>` : '-'}</td>
                </tr>`;
            }).join('');
        }

        function statusText(s) {
            const map = { PENDING: '待打印', PRINTING: '打印中', COMPLETED: '已完成', FAILED: '失败' };
            return map[s] || s;
        }

        window.onload = () => { log('测试客户端已就绪，点击"连接"按钮开始', 'info'); };
    </script>
</body>
</html>
